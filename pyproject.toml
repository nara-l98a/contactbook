[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contactbook"
version = "1.0.0"
description = "A local, privacy-conscious contact book CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Contactbook contributors" }]
dependencies = []

[project.scripts]
contactbook = "contactbook.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
